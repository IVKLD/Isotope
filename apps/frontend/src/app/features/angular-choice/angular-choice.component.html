<header>
  <div class="hero-top">
    <small app-accent-badge>
      <svg lucideCpu size="14"></svg>
      <span>Архитектурный выбор (2026)</span>
    </small>
    <h1>Почему Angular, а не React, Vue или Svelte</h1>
    <p>
      Сравнение архитектурных подходов: Signals, нативный Zoneless, иерархический DI, строгая
      типизация шаблонов и экосистема без зоопарка зависимостей.
    </p>
  </div>

  <app-competitor-tabs
    [selectedKey]="selectedKey()"
    (competitorSelect)="selectedKey.set($event)"
  />
</header>

@if (competitor(); as comp) {
  <app-comparison-accordion [competitor]="comp" />
  <app-architecture-verdict [competitor]="comp" />
} @else {
  <div class="state-loader" aria-live="polite" aria-busy="true">
    <svg lucideLoaderCircle size="32"></svg>
    <p>Загрузка архитектурного анализа...</p>
  </div>
}

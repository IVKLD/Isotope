<nav class="blog-nav" aria-label="Навигация по блогу">
  <a routerLink="/blog" app-ghost-button size="sm">
    <svg lucideArrowLeft size="16"></svg>
    <span>Все статьи</span>
  </a>
  <small app-muted-badge size="sm">Инженерные заметки</small>
</nav>

<article>
  <app-blog-post-header [post]="post()" />

  <div class="blog-body">
    <div class="content-rail">
      <app-blog-post-content [sections]="post().sections" />
      <app-blog-post-footer [reactions]="reactions()" (react)="addReaction($event)" />
    </div>

    <aside class="sidebar-rail">
      <app-blog-post-sidebar [items]="tocItems()" [takeaway]="post().keyTakeaway" />
    </aside>
  </div>
</article>

<a
  routerLink="/terminal"
  [attr.aria-keyshortcuts]="isMac() ? 'Meta+K' : 'Control+K'"
>
  <svg lucideTerminal size="14"></svg>
  <span>CLI</span>
  @if (showShortcut()) {
    <span class="key-combo" aria-hidden="true">
      <kbd>{{ isMac() ? '⌘' : 'Ctrl' }}</kbd>
      <kbd>K</kbd>
    </span>
  }
</a>

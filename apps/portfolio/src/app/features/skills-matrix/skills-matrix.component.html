<section id="skills">
  <div class="container">
    <header>
      <small app-accent-badge>
        <svg lucideLayers size="14"></svg>
        <span>Архитектура &amp; Стек</span>
      </small>
      <h2>Технический стек</h2>
      <p>
        Типизированные конфигурации, инженерные стандарты и архитектурные решения в коммерческой
        разработке.
      </p>
    </header>

    @if (selectedModule(); as selected) {
      <div class="ide-window">
        <app-ide-header
          [modules]="modules()"
          [selected]="selected"
          (moduleSelect)="selectModule($event)"
        />

        <div class="ide-body">
          <div class="editor-pane">
            <app-code-block [code]="selected.code" [showLineNumbers]="true" />
          </div>

          <app-module-inspector [module]="selected" />
        </div>

        <app-ide-statusbar />
      </div>
    }
  </div>
</section>

<pre><code class="hljs" [class.has-lines]="showLineNumbers()">@if (showLineNumbers()) {<div class="code-line-numbers" aria-hidden="true">@for (line of lines(); track $index) {<span>{{ $index + 1 }}</span>}</div><div class="code-lines">@for (line of lines(); track $index) {<div class="code-line" [innerHTML]="line || '&nbsp;'"></div>}</div>} @else {<span [innerHTML]="highlightedCode()"></span>}</code></pre>

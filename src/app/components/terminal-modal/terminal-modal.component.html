<div class="gnome-window">
  <header>
    <div>
      <svg lucideTerminal size="14"></svg>
      <span>Terminal</span>
    </div>

    <div>igni&#64;desktop: ~</div>

    <div>
      <button
        appDialogClose
        type="button"
        aria-label="Закрыть"
      >
        <svg lucideX size="14"></svg>
      </button>
    </div>
  </header>

  <div class="terminal-viewport" #viewport>
    @for (entry of terminal.history(); track trackByEntry($index, entry)) {
      <div class="terminal-entry">
        <div class="prompt-line">
          <div class="path-badge">
            <span>┌─[</span>
            <span>igni&#64;desktop</span>
            <span>]-[</span>
            <span>~</span>
            <span>]</span>
          </div>
          <div class="cmd-line">
            <span>└───»</span>
            <span>{{ entry.command }}</span>
          </div>
        </div>

        <div class="output-block">
          @for (line of entry.lines; track $index) {
            <div>{{ line }}</div>
          }
        </div>
      </div>
    }
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="prompt-path">
      <span>┌─[</span>
      <span>igni&#64;desktop</span>
      <span>]-[</span>
      <span>~</span>
      <span>]</span>
    </div>
    <div class="input-line">
      <span>└───»</span>
      <input
        cdkFocusInitial
        type="text"
        [(ngModel)]="currentInput"
        name="commandInput"
        autocomplete="off"
        spellcheck="false"
        placeholder=""
      />
      <button type="submit" aria-label="Выполнить">
        <svg lucideCornerDownLeft size="14"></svg>
      </button>
    </div>
  </form>

  <footer>
    <span>Быстрый запуск:</span>
    <button type="button" (click)="terminal.execute('whoami')">whoami</button>
    <button type="button" (click)="terminal.execute('projects')">projects</button>
    <button type="button" (click)="terminal.execute('stack')">stack</button>
    <button type="button" (click)="terminal.execute('contact')">contact</button>
    <button type="button" (click)="terminal.execute('clear')">clear</button>
  </footer>
</div>

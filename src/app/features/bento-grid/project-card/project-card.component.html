<article (click)="inspect.emit(project())">
  <header>
    <div>
      <small>
        <span>{{ project().year }}</span>
        <span>•</span>
        <span>{{ project().role }}</span>
      </small>
      <h3>{{ project().name }}</h3>
    </div>

    <nav (click)="$event.stopPropagation()">
      @if (project().githubUrl) {
        <a
          appOutlineButton
          size="sm"
          [href]="project().githubUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Код на GitHub"
        >
          <svg lucideFolderGit2 size="14"></svg>
          <span>Код</span>
          <svg lucideExternalLink size="12"></svg>
        </a>
      } @else {
        <span appBadge="muted">
          <svg lucideLock size="12"></svg>
          <span>Приватный</span>
        </span>
      }
    </nav>
  </header>

  <p>{{ project().shortDesc }}</p>

  <ul class="feature-list">
    @for (item of project().highlights; track $index) {
      <li>
        <span>{{ item }}</span>
      </li>
    }
  </ul>

  <footer>
    <app-tech-pills [items]="project().techStack" />

    <button
      type="button"
      appGhostButton
      size="sm"
      (click)="inspect.emit(project())"
      [attr.aria-label]="'Разбор проекта ' + project().name"
    >
      <svg lucideCodeXml size="14"></svg>
      <span>Разбор</span>
    </button>
  </footer>
</article>

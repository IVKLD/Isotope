<header (dblclick)="toggleMaximize()">
  <div>
    <svg lucideTerminal size="14"></svg>
    <span>igni@dev: ~</span>
  </div>

  <div>
    <button
      app-icon-button
      (click)="toggleMaximize()"
      [attr.aria-label]="isMaximized() ? 'Восстановить' : 'Развернуть'"
      title="{{ isMaximized() ? 'Восстановить' : 'Развернуть' }}"
    >
      @if (isMaximized()) {
        <svg lucideMinimize2 size="13"></svg>
      } @else {
        <svg lucideMaximize2 size="13"></svg>
      }
    </button>
    <button app-dialog-close app-icon-button aria-label="Закрыть" title="Закрыть">
      <svg lucideX size="14"></svg>
    </button>
  </div>
</header>

<div class="terminal-viewport" #viewport>
  @for (entry of terminal.history(); track $index) {
    <div class="terminal-entry">
      <div class="prompt-line">
        <span class="user-host">igni@dev</span>
        <span class="prompt-colon">:</span>
        <span class="prompt-path">~</span>
        <span class="prompt-char">$</span>
        <span class="cmd-text">{{ entry.command }}</span>
      </div>

      <div class="output-block">
        @for (line of entry.lines; track $index) {
          <div>{{ line }}</div>
        }
      </div>
    </div>
  }
</div>

<form (submit)="onSubmit($event)">
  <div class="input-line">
    <span class="user-host">igni@dev</span>
    <span class="prompt-colon">:</span>
    <span class="prompt-path">~</span>
    <span class="prompt-char">$</span>
    <input
      #cmdInput
      type="text"
      [value]="currentInput()"
      (input)="onInput($event)"
      name="commandInput"
      autocomplete="off"
      spellcheck="false"
      placeholder=""
    />
    <button app-icon-button class="xs" type="submit" aria-label="Выполнить">
      <svg lucideCornerDownLeft size="14"></svg>
    </button>
  </div>
</form>

<footer>
  <span>Быстрый запуск:</span>
  @for (cmd of quickCommands; track cmd) {
    <button app-outline-button class="xs" type="button" (click)="runCommand(cmd)">{{ cmd }}</button>
  }
</footer>

@if (!isMaximized()) {
  <div
    class="resize-handle"
    (pointerdown)="onResizeStart($event)"
    title="Изменить размер"
    aria-hidden="true"
  >
    <svg lucideMoveDiagonal2 size="11"></svg>
  </div>
}
